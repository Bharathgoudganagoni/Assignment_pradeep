# ==============================================================================
# Render Blueprint Specification for ENECTRON Enquiry Management System
# Single Web Service hosting both static frontend and Node.js / Nodemailer API.
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: enectron-website
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: "*"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RECEIVER_EMAIL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: BUILDER_EMAIL
        sync: false
      - key: SEND_CUSTOMER_ACK
        value: "true"
